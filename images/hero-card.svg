<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 400" width="540" height="400" fill="none">
  <defs>
    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F766E"/>
      <stop offset="100%" stop-color="#134E4A"/>
    </linearGradient>
    <linearGradient id="cardGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Background decorative circular glow -->
  <circle cx="270" cy="200" r="160" fill="#CCFBF1" opacity="0.6"/>
  <circle cx="420" cy="90" r="40" fill="#FEF3C7" opacity="0.8"/>

  <!-- Back Card (Tilted) -->
  <g transform="rotate(-10 240 220)" filter="url(#shadow)">
    <rect x="70" y="90" width="320" height="200" rx="16" fill="url(#cardGrad2)"/>
    <rect x="95" y="115" width="45" height="35" rx="6" fill="#F59E0B" opacity="0.9"/>
    <!-- Chip details -->
    <path d="M95 132 H140 M117 115 V150" stroke="#B45309" stroke-width="2"/>
    <rect x="95" y="170" width="180" height="12" rx="4" fill="#94A3B8" opacity="0.6"/>
    <rect x="95" y="195" width="120" height="10" rx="4" fill="#64748B" opacity="0.5"/>
    <circle cx="340" cy="245" r="22" fill="#F43F5E" opacity="0.7"/>
    <circle cx="315" cy="245" r="22" fill="#F59E0B" opacity="0.7"/>
  </g>

  <!-- Front Primary Card -->
  <g transform="rotate(5 270 210)" filter="url(#shadow)">
    <rect x="120" y="80" width="340" height="215" rx="16" fill="url(#cardGrad1)"/>
    <!-- Header stripe -->
    <rect x="120" y="80" width="340" height="42" rx="16" fill="#115E59"/>
    <rect x="120" y="110" width="340" height="12" fill="#115E59"/>
    <!-- Card Logo / Title -->
    <text x="145" y="108" font-family="'Hind Siliguri', 'Segoe UI', sans-serif" font-weight="700" font-size="16" fill="#FFFFFF">স্মার্ট আইডি কার্ড</text>
    <rect x="400" y="93" width="42" height="18" rx="9" fill="#F59E0B"/>
    <text x="410" y="106" font-family="sans-serif" font-weight="700" font-size="10" fill="#0F172A">PVC</text>

    <!-- Photo Placeholder -->
    <rect x="145" y="135" width="70" height="85" rx="8" fill="#E2E8F0"/>
    <circle cx="180" cy="165" r="16" fill="#94A3B8"/>
    <path d="M158 212 C158 190, 202 190, 202 212" fill="#94A3B8"/>

    <!-- Data lines -->
    <rect x="230" y="140" width="140" height="12" rx="3" fill="#FFFFFF" opacity="0.95"/>
    <rect x="230" y="162" width="100" height="10" rx="3" fill="#99F6E4"/>
    <rect x="230" y="182" width="170" height="10" rx="3" fill="#CCFBF1" opacity="0.7"/>
    <rect x="230" y="202" width="120" height="8" rx="3" fill="#CCFBF1" opacity="0.5"/>

    <!-- QR / Barcode element -->
    <rect x="385" y="140" width="55" height="55" rx="6" fill="#FFFFFF"/>
    <!-- Barcode simulation -->
    <path d="M393 148 V187 M398 148 V187 M403 148 V187 M407 148 V187 M413 148 V187 M418 148 V187 M424 148 V187 M430 148 V187" stroke="#0F172A" stroke-width="2"/>

    <!-- Hologram badge -->
    <g transform="translate(145, 235)">
      <circle cx="20" cy="20" r="16" fill="url(#accentGrad)"/>
      <path d="M12 20 L18 26 L28 14" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="44" y="24" font-family="'Hind Siliguri', sans-serif" font-weight="600" font-size="13" fill="#F8FAFC">১০০% ওয়াটারপ্রুফ গ্যারান্টি</text>
    </g>
  </g>

  <!-- Floating Quality Badge -->
  <g transform="translate(60, 290)" filter="url(#shadow)">
    <rect width="165" height="50" rx="25" fill="#FFFFFF" stroke="#0F766E" stroke-width="2"/>
    <circle cx="25" cy="25" r="16" fill="#0F766E"/>
    <text x="18" y="30" font-family="sans-serif" font-weight="900" font-size="14" fill="#FFFFFF">✓</text>
    <text x="48" y="24" font-family="'Hind Siliguri', sans-serif" font-weight="700" font-size="12" fill="#0F172A">০.৭৬ মিমি থিকনেস</text>
    <text x="48" y="38" font-family="'Hind Siliguri', sans-serif" font-size="11" fill="#64748B">আসল এটিএম কার্ড মান</text>
  </g>
</svg>
